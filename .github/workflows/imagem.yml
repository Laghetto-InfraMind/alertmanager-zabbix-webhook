# Build, scan e publicacao da imagem no GHCR.
# - PR e push em master: build + Trivy (falha em CRITICAL/HIGH com correcao disponivel).
# - Tag vX.Y.Z: idem + push para ghcr.io/laghetto-inframind/alertmanager-zabbix-webhook.
name: imagem

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # segunda 06:17 UTC: rescan semanal pega CVE novo na base

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/laghetto-inframind/alertmanager-zabbix-webhook

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...

  imagem:
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
      - name: Build local para o scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: azw:scan
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 \
            image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 azw:scan
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
